{% extends "base.html" %}
{% block title %}Sign up · Rate the Food{% endblock %}
{% block content %}
<div class="form-page">
  <div class="card card-pad">
    <h1>Join Rate the Food</h1>
    <p class="lead">Create an account to rate SCU food spots and the dishes you order.</p>
    <form method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6">
        <span class="hint">At least 6 characters.</span>
      </div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Create account</button>
    </form>
  </div>
  <p class="form-foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
